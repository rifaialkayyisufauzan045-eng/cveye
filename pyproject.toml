[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cveye"
version = "1.0.0"
description = "CVE Intelligence & Technology Scanner"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "CVEye Contributors"}]
keywords = ["security", "cve", "vulnerability", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "packaging>=24.0",
    "dnspython>=2.6.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
cveye = "cveye.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cveye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
